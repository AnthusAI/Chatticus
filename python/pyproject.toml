[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatticus"
version = "0.14.0"
description = "Named AI teammates on a computer you control."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
aws = [
    "boto3",
    "botocore[crt]",
    "PyJWT[crypto]",
]
dev = [
    "behave",
    "black==26.3.1",
    "boto3",
    "botocore[crt]",
    "cryptography",
    "fastapi",
    "httpx",
    "kanbus",
    "moto",
    "PyJWT[crypto]",
    "pytest",
    "python-dotenv",
    "ruff==0.15.5",
    "uvicorn",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
markers = [
    "live_openai: calls the live OpenAI API when OPENAI_API_KEY is set",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/chatticus/__init__.py:__version__"]
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
allow_zero_version = true
major_on_zero = false
commit_parser = "conventional"
