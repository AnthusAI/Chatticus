name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        working-directory: infra
        run: npm test

      - name: Check customer-computers template artifact
        working-directory: infra
        run: npm run check:customer-computers-template

      - name: Synth
        working-directory: infra
        env:
          CHATTICUS_STUB_WEB_BUNDLE: "1"
        run: npx cdk synth

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

  conversation:
    runs-on: ubuntu-latest
    services:
      moto:
        image: motoserver/moto:5.2.3
        ports:
          - 5555:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Wait for moto
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5555) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Install
        run: npm ci

      - name: Typecheck
        working-directory: conversation
        run: npm run typecheck

      - name: Test
        working-directory: conversation
        env:
          CHATTICUS_TEST_AWS_ENDPOINT: http://127.0.0.1:5555
        run: npm test

      - name: Cucumber features
        working-directory: conversation
        env:
          CHATTICUS_TEST_AWS_ENDPOINT: http://127.0.0.1:5555
        run: npm run test:features

      - name: Cucumber features dry run
        working-directory: conversation
        run: npm run test:features:dry
