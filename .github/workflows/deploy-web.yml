name: Deploy web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Named cloud environment to deploy
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            web/package-lock.json

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web static export
        working-directory: web
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy thin-turn stack
        working-directory: infra
        run: |
          case "${{ inputs.environment }}" in
            development) npx cdk deploy ChatticusThinTurn --require-approval never ;;
            staging) npx cdk deploy ChatticusThinTurnStaging --require-approval never ;;
            production) npx cdk deploy ChatticusThinTurnProduction --require-approval never ;;
          esac

      - name: Deploy web stack
        working-directory: infra
        run: |
          case "${{ inputs.environment }}" in
            development) npx cdk deploy ChatticusWeb --require-approval never ;;
            staging) npx cdk deploy ChatticusWebStaging --require-approval never ;;
            production) npx cdk deploy ChatticusWebProduction --require-approval never ;;
          esac
