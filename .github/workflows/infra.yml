name: Infra

on:
  push:
    branches: [main]
  pull_request:

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install
        working-directory: infra
        run: npm ci
      - name: Synth
        working-directory: infra
        run: npx cdk synth
