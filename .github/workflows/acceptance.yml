name: Acceptance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Named cloud environment to exercise
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - production

permissions:
  contents: read

jobs:
  thin-turn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Exercise thin turn
        working-directory: python
        env:
          CHATTICUS_DEVELOPMENT_BASE_URL: ${{ secrets.CHATTICUS_DEVELOPMENT_BASE_URL }}
          CHATTICUS_STAGING_BASE_URL: ${{ secrets.CHATTICUS_STAGING_BASE_URL }}
          CHATTICUS_PRODUCTION_BASE_URL: ${{ secrets.CHATTICUS_PRODUCTION_BASE_URL }}
        run: python scripts/exercise_thin_turn.py --environment ${{ inputs.environment }}
