name: Acceptance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Named cloud environment to exercise
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - production
  push:
    branches: [develop]

permissions:
  contents: read
  id-token: write

jobs:
  thin-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CHATTICUS_ENVIRONMENT: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Assume the named-environment GitHub acceptance role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::335163751677:role/chatticus-${{ env.CHATTICUS_ENVIRONMENT }}-github-acceptance
          aws-region: us-east-1

      - name: Exercise thin turn
        working-directory: python
        env:
          CHATTICUS_DEVELOPMENT_BASE_URL: ${{ secrets.CHATTICUS_DEVELOPMENT_BASE_URL }}
          CHATTICUS_STAGING_BASE_URL: ${{ secrets.CHATTICUS_STAGING_BASE_URL }}
          CHATTICUS_PRODUCTION_BASE_URL: ${{ secrets.CHATTICUS_PRODUCTION_BASE_URL }}
        run: |
          python scripts/exercise_thin_turn.py \
            --environment "$CHATTICUS_ENVIRONMENT" \
            --user-id "gh-${GITHUB_RUN_ID}"
