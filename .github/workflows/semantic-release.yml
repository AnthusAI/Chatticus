name: Semantic Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.actor.login != 'anthusbot' &&
          github.event.workflow_run.actor.login != 'github-actions[bot]'
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel_version.outputs.released }}
      tag: ${{ steps.semrel_version.outputs.tag }}
      version: ${{ steps.semrel_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Ensure release branch checkout
        env:
          RELEASE_BRANCH: main
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_BRANCH"
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity and auth for release push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url --push origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Semantic Release
        id: semrel_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          before_tags="$(git tag | sort || true)"
          npx semantic-release
          after_tags="$(git tag | sort || true)"

          new_tag="$(
            comm -13 \
              <(printf '%s\n' "$before_tags" | sed '/^$/d') \
              <(printf '%s\n' "$after_tags" | sed '/^$/d') \
              | tail -n1
          )"

          if [ -n "$new_tag" ]; then
            version_without_prefix="${new_tag#${new_tag%%[0-9]*}}"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
            echo "version=${version_without_prefix}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  guard-pre-1-0:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block accidental 1.x release
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          echo "Computed release version: ${RELEASE_VERSION}"
          case "${RELEASE_VERSION}" in
            0.*) ;;
            *)
              echo "Refusing release: expected pre-1.0.0 version, got ${RELEASE_VERSION}" >&2
              exit 1
              ;;
          esac
