# Local Chatticus: Postgres now, control plane and computer next.
# AWS is not required to prove worker routing against the in-memory kernel.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatticus
      POSTGRES_PASSWORD: chatticus
      POSTGRES_DB: chatticus
    ports:
      - "5432:5432"
    volumes:
      - chatticus-postgres:/var/lib/postgresql/data

volumes:
  chatticus-postgres:
