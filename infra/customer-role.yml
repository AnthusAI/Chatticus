AWSTemplateFormatVersion: '2010-09-09'
Description: 'Chatticus Cross-Account IAM Role for Organization Computer Provisioning and Operation'

Parameters:
  AnthusAccountId:
    Type: String
    Description: 'The 12-digit AWS Account ID for Anthus (provided by the Anthus team).'
    AllowedPattern: '^\d{12}$'
  OrganizationId:
    Type: String
    Description: 'Your Chatticus Organization ID (used as the ExternalId for secure AssumeRole).'
    MinLength: 1
    AllowedPattern: '^[a-z0-9][a-z0-9._-]*$'
    ConstraintDescription: 'OrganizationId must be lowercase letters, digits, dots, underscores, or hyphens.'

Resources:
  OrganizationSnapshotBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'chatticus-snapshots-${OrganizationId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ChatticusComputersBoundary:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: 'ChatticusComputersBoundary'
      Description: 'Permissions boundary every ChatticusComputers role must carry; caps computer roles at snapshot access, log writing, image pulls, and ECS Exec channels.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SnapshotReadWrite
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
            Resource: !Sub '${OrganizationSnapshotBucket.Arn}/*'
          - Sid: ComputerLogs
            Effect: Allow
            Action:
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
            Resource: '*'
          - Sid: ComputerImagePull
            Effect: Allow
            Action:
              - 'ecr:GetAuthorizationToken'
              - 'ecr:BatchCheckLayerAvailability'
              - 'ecr:BatchGetImage'
              - 'ecr:GetDownloadUrlForLayer'
            Resource: '*'
          - Sid: EcsExecChannels
            Effect: Allow
            Action:
              - 'ssmmessages:CreateControlChannel'
              - 'ssmmessages:CreateDataChannel'
              - 'ssmmessages:OpenControlChannel'
              - 'ssmmessages:OpenDataChannel'
            Resource: '*'

  ChatticusCrossAccountRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'ChatticusOrganizationComputerRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AnthusAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref OrganizationId
      Policies:
        - PolicyName: 'ChatticusProvisioningAndOperation'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CostExplorerRead
                Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                Resource: '*'
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - 'cloudformation:CreateStack'
                  - 'cloudformation:UpdateStack'
                  - 'cloudformation:DeleteStack'
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:DescribeStackEvents'
                  - 'cloudformation:DescribeStackResources'
                  - 'cloudformation:GetTemplate'
                  - 'cloudformation:GetTemplateSummary'
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ChatticusComputers*/*'
              - Sid: ECSUnscoped
                Effect: Allow
                Action:
                  - 'ecs:RegisterTaskDefinition'
                  - 'ecs:DeregisterTaskDefinition'
                  - 'ecs:DescribeTaskDefinition'
                  - 'ecs:ListClusters'
                  - 'ecs:ListServices'
                  - 'ecs:ListTasks'
                Resource: '*'
              - Sid: ECSScopedToChatticusComputers
                Effect: Allow
                Action:
                  - 'ecs:CreateCluster'
                  - 'ecs:DeleteCluster'
                  - 'ecs:DescribeClusters'
                  - 'ecs:RunTask'
                  - 'ecs:StopTask'
                  - 'ecs:DescribeTasks'
                  - 'ecs:CreateService'
                  - 'ecs:UpdateService'
                  - 'ecs:DeleteService'
                  - 'ecs:DescribeServices'
                  - 'ecs:TagResource'
                  - 'ecs:UntagResource'
                  - 'ecs:ListTagsForResource'
                Resource:
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/ChatticusComputers*'
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/ChatticusComputers*/*'
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/ChatticusComputers*/*'
                  - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/ChatticusComputers*:*'
              - Sid: EC2
                Effect: Allow
                Action:
                  - 'ec2:CreateVpc'
                  - 'ec2:DeleteVpc'
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeAvailabilityZones'
                  - 'ec2:CreateSubnet'
                  - 'ec2:DeleteSubnet'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:ModifySubnetAttribute'
                  - 'ec2:CreateSecurityGroup'
                  - 'ec2:DeleteSecurityGroup'
                  - 'ec2:DescribeSecurityGroups'
                  - 'ec2:AuthorizeSecurityGroupIngress'
                  - 'ec2:AuthorizeSecurityGroupEgress'
                  - 'ec2:RevokeSecurityGroupIngress'
                  - 'ec2:RevokeSecurityGroupEgress'
                  - 'ec2:CreateRouteTable'
                  - 'ec2:DeleteRouteTable'
                  - 'ec2:DescribeRouteTables'
                  - 'ec2:CreateRoute'
                  - 'ec2:DeleteRoute'
                  - 'ec2:AssociateRouteTable'
                  - 'ec2:DisassociateRouteTable'
                  - 'ec2:CreateInternetGateway'
                  - 'ec2:DeleteInternetGateway'
                  - 'ec2:AttachInternetGateway'
                  - 'ec2:DetachInternetGateway'
                  - 'ec2:DescribeInternetGateways'
                  - 'ec2:CreateTags'
                  - 'ec2:DeleteTags'
                  - 'ec2:DescribeTags'
                  - 'ec2:ModifyVpcAttribute'
                Resource: '*'
              - Sid: ECR
                Effect: Allow
                Action:
                  - 'ecr:CreateRepository'
                  - 'ecr:DeleteRepository'
                  - 'ecr:DescribeRepositories'
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:GetRepositoryPolicy'
                  - 'ecr:SetRepositoryPolicy'
                  - 'ecr:DeleteRepositoryPolicy'
                  - 'ecr:DescribeImages'
                  - 'ecr:ListImages'
                  - 'ecr:PutImage'
                  - 'ecr:InitiateLayerUpload'
                  - 'ecr:UploadLayerPart'
                  - 'ecr:CompleteLayerUpload'
                  - 'ecr:TagResource'
                  - 'ecr:UntagResource'
                Resource: '*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:DeleteLogGroup'
                  - 'logs:DescribeLogGroups'
                  - 'logs:PutRetentionPolicy'
                  - 'logs:ListTagsLogGroup'
                  - 'logs:TagResource'
                  - 'logs:UntagResource'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: '*'
              - Sid: IAMCreateBoundedComputerRoles
                Effect: Allow
                Action:
                  - 'iam:CreateRole'
                  - 'iam:PutRolePolicy'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/ChatticusComputers*'
                Condition:
                  StringEquals:
                    'iam:PermissionsBoundary': !Ref ChatticusComputersBoundary
              - Sid: IAMManageComputerRoles
                Effect: Allow
                Action:
                  - 'iam:DeleteRole'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:TagRole'
                  - 'iam:UntagRole'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/ChatticusComputers*'
              - Sid: IAMReadRoles
                Effect: Allow
                Action:
                  - 'iam:GetRole'
                  - 'iam:GetRolePolicy'
                  - 'iam:ListRolePolicies'
                  - 'iam:ListAttachedRolePolicies'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/ChatticusComputers*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/ChatticusOrganizationComputerRole'
              - Sid: IAMPassComputerRolesToEcsTasks
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/ChatticusComputers*'
                Condition:
                  StringEquals:
                    'iam:PassedToService': 'ecs-tasks.amazonaws.com'
              - Sid: ECSServiceLinkedRole
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName': 'ecs.amazonaws.com'

Outputs:
  SnapshotBucketName:
    Description: 'Organization snapshot bucket in this AWS account'
    Value: !Ref OrganizationSnapshotBucket
  ComputersBoundaryArn:
    Description: 'The permissions boundary every ChatticusComputers role must carry'
    Value: !Ref ChatticusComputersBoundary
  RoleArn:
    Description: 'The ARN of the cross-account role'
    Value: !GetAtt ChatticusCrossAccountRole.Arn
